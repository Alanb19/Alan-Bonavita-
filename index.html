<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mobility" />
<meta name="theme-color" content="#0f172a" />
<title>Mobility Core Gymnast</title>
<style>
:root {
  --bg:      #0f172a;
  --card:    #1e293b;
  --row:     #2d3f55;
  --primary: #38bdf8;
  --green:   #22c55e;
  --text:    #f8fafc;
  --muted:   #94a3b8;
  --done-bg: #0f2a1a;
  --r:       14px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 14px 12px 60px;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ── Header ── */
header { text-align: center; margin-bottom: 24px; }
header h1 {
  font-size: clamp(1.3rem, 5vw, 1.9rem);
  color: var(--primary);
  margin-bottom: 16px;
  letter-spacing: -.5px;
}
.week-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.week-label { font-size: .75rem; color: var(--muted); }
.bar-bg {
  flex: 1; max-width: 200px; height: 8px;
  background: var(--row); border-radius: 99px; overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--green));
  border-radius: 99px;
  transition: width .5s ease;
  width: 0%;
}
.week-count { font-size: .75rem; color: var(--muted); min-width: 44px; }
.btn-reset-all {
  background: transparent;
  border: 1px solid var(--muted);
  color: var(--muted);
  font-size: .78rem;
  padding: 5px 14px;
  border-radius: 99px;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.btn-reset-all:active { border-color: var(--primary); color: var(--primary); }

/* ── Banner instalar ── */
.install-banner {
  display: none;
  background: var(--card);
  border: 1px solid var(--primary);
  border-radius: var(--r);
  padding: 12px 14px;
  margin-bottom: 18px;
  font-size: .82rem;
  color: var(--muted);
  line-height: 1.5;
  text-align: center;
}
.install-banner strong { color: var(--primary); }
.install-banner.visible { display: block; }
.btn-close-banner {
  background: transparent; border: none;
  color: var(--muted); font-size: 1rem;
  cursor: pointer; float: right; margin-top: -4px;
}

/* ── Day card ── */
.day-card {
  background: var(--card);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
  border-left: 4px solid transparent;
  transition: border-color .3s;
}
.day-card.today    { border-left-color: var(--primary); }
.day-card.done-all { border-left-color: var(--green); }
.day-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
}
.day-title {
  font-size: .95rem; font-weight: 700;
  color: var(--green); flex: 1; line-height: 1.3;
}
.badge-hoy {
  font-size: .65rem; background: var(--primary);
  color: #0f172a; font-weight: 800;
  padding: 2px 6px; border-radius: 99px;
  margin-left: 5px; vertical-align: middle; white-space: nowrap;
}
.day-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 4px;
}
.day-count { font-size: .75rem; color: var(--muted); white-space: nowrap; }
.day-bar-bg {
  width: 70px; height: 5px;
  background: var(--row); border-radius: 99px; overflow: hidden;
}
.day-bar-fill {
  height: 100%; background: var(--green);
  border-radius: 99px; transition: width .4s ease;
}
.msg-done { font-size: .72rem; color: var(--green); font-weight: 700; display: none; }
.done-all .msg-done  { display: block; }
.done-all .day-bar-bg { display: none; }
.btn-reset-day {
  background: transparent; border: none;
  color: var(--muted); font-size: .85rem; cursor: pointer;
  padding: 2px 4px; line-height: 1;
}
.btn-reset-day:active { color: var(--primary); }

/* ── Exercise row ── */
.ex {
  display: flex; align-items: center;
  background: var(--row);
  padding: 11px 12px; border-radius: 10px;
  margin-bottom: 8px; gap: 10px;
  transition: background .25s, opacity .25s;
}
.ex.checked { background: var(--done-bg); opacity: .7; }
.ex-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ex-name {
  font-weight: 600; font-size: .9rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color .2s;
}
.ex.checked .ex-name { color: #4ade80; text-decoration: line-through; }
.ex-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ex-sets {
  font-size: .72rem; color: var(--muted);
  background: rgba(255,255,255,.07); padding: 1px 7px; border-radius: 5px;
}
.ex-link {
  font-size: .72rem; color: var(--primary);
  text-decoration: none; display: flex; align-items: center; gap: 3px;
}
.ex-link:active { opacity: .6; }
.ex-check {
  -webkit-appearance: none; appearance: none;
  width: 24px; height: 24px; min-width: 24px;
  border: 2px solid var(--muted); border-radius: 7px;
  cursor: pointer; position: relative;
  transition: background .2s, border-color .2s;
}
.ex-check:checked { background: var(--green); border-color: var(--green); }
.ex-check:checked::after {
  content: '✓';
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: #0f172a; font-size: .85rem; font-weight: 900;
  line-height: 22px; text-align: center; width: 100%;
}

/* ── Rest card ── */
.rest-card {
  background: var(--card); border-radius: var(--r);
  padding: 18px 16px; margin-bottom: 16px;
  text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
.rest-card .day-title { color: var(--muted); margin-bottom: 6px; display: block; }
.rest-card p { font-size: .85rem; color: var(--muted); }

@media (max-width: 380px) {
  .day-head { flex-direction: column; gap: 6px; }
  .day-right { flex-direction: row; align-items: center; }
}
</style>
</head>
<body>

<header>
  <h1>🧠 Mobility Core Gymnast</h1>
  <div class="week-wrap">
    <span class="week-label">Semana</span>
    <div class="bar-bg"><div class="bar-fill" id="wFill"></div></div>
    <span class="week-count" id="wCount">0 / 0</span>
  </div>
  <button class="btn-reset-all" id="btnResetAll">↺ Reiniciar semana</button>
</header>

<!-- Banner instrucciones iOS -->
<div class="install-banner" id="installBanner">
  <button class="btn-close-banner" id="btnCloseBanner">✕</button>
  📲 <strong>Guardar en pantalla de inicio:</strong><br>
  Toca el icono <strong>Compartir</strong> (□↑) en Safari → <strong>"Añadir a pantalla de inicio"</strong>
</div>

<main id="app"></main>

<script>
const workouts = [
  {
    day: '📅 Lunes — Core + Caderas',
    exercises: [
      { name: 'Cat-Cow',          sets: '2×10',   video: 'https://www.youtube.com/watch?v=kqnua4rHVVA' },
      { name: 'Pelvic Tilts',     sets: '2×15',   video: 'https://www.youtube.com/watch?v=44ScXWFaVBs' },
      { name: 'Dead Bug',         sets: '2×10',   video: 'https://www.youtube.com/watch?v=g_BYB0R-4Ws' },
      { name: '90/90 Switches',   sets: '3×10',   video: 'https://www.youtube.com/watch?v=2uWQ4YxU4VQ' },
      { name: 'Deep Squat Hold',  sets: '3×30 s', video: 'https://www.youtube.com/watch?v=ZFCDMXtKAhA' },
      { name: 'Cossack Squat',    sets: '3×8',    video: 'https://www.youtube.com/watch?v=tpczTeSkHz0' },
      { name: 'Hollow Hold',      sets: '3×20 s', video: 'https://www.youtube.com/watch?v=LlDNef_Ztsc' },
    ],
  },
  {
    day: '📅 Martes — Natación + Hombro',
    exercises: [
      { name: 'Thoracic Extension', sets: '2 min', video: 'https://www.youtube.com/watch?v=SdQhQZlO2ys' },
      { name: 'Wall Slides',        sets: '3×10',  video: 'https://www.youtube.com/watch?v=ywYi4rBhRBQ' },
      { name: 'External Rotations', sets: '3×15',  video: 'https://www.youtube.com/watch?v=5pR0egEr8L0' },
      { name: 'Scapular Push-ups',  sets: '3×12',  video: 'https://www.youtube.com/watch?v=1v9e8PdmqEI' },
    ],
  },
  {
    day: '📅 Miércoles — Hombros + Postura',
    exercises: [
      { name: 'Band Pull Aparts', sets: '3×15', video: 'https://www.youtube.com/watch?v=JObYtU7Y7ag' },
      { name: 'Shoulder CARs',    sets: '2×5',  video: 'https://www.youtube.com/watch?v=HiCnRk1_z5Q' },
      { name: 'Open Books',       sets: '2×10', video: 'https://www.youtube.com/watch?v=k0q1t7lZb6M' },
      { name: 'Bird Dog',         sets: '3×10', video: 'https://www.youtube.com/watch?v=wiFNA3sqjCA' },
    ],
  },
  {
    day: '📅 Jueves — Tenis + Recovery',
    exercises: [
      { name: 'World Greatest Stretch', sets: '2×5',    video: 'https://www.youtube.com/watch?v=oVOnXIiPgM8' },
      { name: 'Deep Squat Hold',        sets: '3×30 s', video: 'https://www.youtube.com/watch?v=ZFCDMXtKAhA' },
    ],
  },
  {
    day: '📅 Viernes — Core + Flexibilidad',
    exercises: [
      { name: 'Jefferson Curl',     sets: '3×8',   video: 'https://www.youtube.com/watch?v=y_APeWo643w' },
      { name: 'Frog Stretch',       sets: '2 min', video: 'https://www.youtube.com/watch?v=0Z9J5WogtWo' },
      { name: 'Compression Pulses', sets: '3×15',  video: 'https://www.youtube.com/watch?v=Qk7b0H0sQuc' },
    ],
  },
  {
    day: '📅 Sábado — Natación + Movilidad',
    exercises: [
      { name: 'Bear Crawl',        sets: '2×20 m', video: 'https://www.youtube.com/watch?v=2-4r6Z1N0nI' },
      { name: 'Crab Reach',        sets: '2×10',   video: 'https://www.youtube.com/watch?v=4BOTvaRaDjI' },
      { name: 'Down Dog to Cobra', sets: '2×10',   video: 'https://www.youtube.com/watch?v=8lDc4Ri9zAQ' },
    ],
  },
  {
    day: '😴 Domingo — Descanso activo',
    rest: true,
    tip: 'Camina, estira suavemente o practica respiración diafragmática. Tu cuerpo lo agradece.',
  },
];

// ── Persistence ──────────────────────────────────────────────────────
const KEY = 'mcg_v1';
let prog = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
const save = () => localStorage.setItem(KEY, JSON.stringify(prog));

// ── Today (Mon=0 … Sun=6) ────────────────────────────────────────────
const todayIdx = (() => { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; })();

// ── Helpers ──────────────────────────────────────────────────────────
const countDone = di => Object.values(prog[`d${di}`] || {}).filter(Boolean).length;
const pct = (di, total) => total ? Math.round(countDone(di) / total * 100) : 0;

// ── Render ───────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  workouts.forEach((day, di) => {
    app.appendChild(day.rest ? makeRestCard(day, di) : makeDayCard(day, di));
  });
  // Week bar
  let tot = 0, done = 0;
  workouts.forEach((d, i) => { if (d.rest) return; tot += d.exercises.length; done += countDone(i); });
  document.getElementById('wCount').textContent = `${done} / ${tot}`;
  document.getElementById('wFill').style.width  = tot ? `${Math.round(done/tot*100)}%` : '0%';
}

function makeRestCard(day, di) {
  const c = document.createElement('div');
  c.className = 'rest-card' + (di === todayIdx ? ' today' : '');
  c.innerHTML = `<span class="day-title">${day.day}</span><p>${day.tip}</p>`;
  return c;
}

function makeDayCard(day, di) {
  const key = `d${di}`;
  if (!prog[key]) prog[key] = {};
  const total = day.exercises.length;
  const done  = countDone(di);
  const card  = document.createElement('div');
  card.className = 'day-card' + (di === todayIdx ? ' today' : '') + (done === total ? ' done-all' : '');
  card.innerHTML = `
    <div class="day-head">
      <div class="day-title">${day.day}${di === todayIdx ? '<span class="badge-hoy">HOY</span>' : ''}</div>
      <div class="day-right">
        <span class="day-count">${done} / ${total}</span>
        <div class="day-bar-bg"><div class="day-bar-fill" style="width:${pct(di,total)}%"></div></div>
        <span class="msg-done">✅ ¡Completado!</span>
        <button class="btn-reset-day" data-di="${di}">↺</button>
      </div>
    </div>`;
  day.exercises.forEach((ex, ei) => {
    const checked = !!prog[key][ei];
    const row = document.createElement('div');
    row.className = 'ex' + (checked ? ' checked' : '');
    row.innerHTML = `
      <div class="ex-info">
        <span class="ex-name">${ex.name}</span>
        <div class="ex-meta">
          <span class="ex-sets">${ex.sets}</span>
          <a class="ex-link" href="${ex.video}" target="_blank" rel="noopener noreferrer">🎥 Ver vídeo</a>
        </div>
      </div>
      <input type="checkbox" class="ex-check" ${checked ? 'checked' : ''}
             aria-label="${ex.name}" data-di="${di}" data-ei="${ei}" />`;
    card.appendChild(row);
  });
  return card;
}

// ── Events (delegation) ──────────────────────────────────────────────
document.getElementById('app').addEventListener('change', e => {
  if (!e.target.matches('.ex-check')) return;
  const { di, ei } = e.target.dataset;
  if (!prog[`d${di}`]) prog[`d${di}`] = {};
  prog[`d${di}`][ei] = e.target.checked;
  save(); render();
});
document.getElementById('app').addEventListener('click', e => {
  const btn = e.target.closest('.btn-reset-day');
  if (!btn) return;
  prog[`d${btn.dataset.di}`] = {};
  save(); render();
});
document.getElementById('btnResetAll').addEventListener('click', () => {
  if (confirm('¿Reiniciar todo el progreso de la semana?')) { prog = {}; save(); render(); }
});

// ── iOS install banner (solo en Safari móvil, no instalada) ──────────
const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isSafari  = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
const installed = window.navigator.standalone;
const dismissed = localStorage.getItem('banner_dismissed');
if (isIOS && isSafari && !installed && !dismissed) {
  document.getElementById('installBanner').classList.add('visible');
}
document.getElementById('btnCloseBanner').addEventListener('click', () => {
  document.getElementById('installBanner').classList.remove('visible');
  localStorage.setItem('banner_dismissed', '1');
});

render();
</script>
</body>
</html>
